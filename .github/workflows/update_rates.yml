name: Daily Rates & Money Supply Update

on:
  schedule:
    # Run at 10:00 UTC (6:00 PM MYT) every Monday through Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Required to push commits back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run update script
      run: |
        python update_rates.py

    - name: Commit and push if there are changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add FXrate.csv "Money supply.xlsx"
        # Only commit and push if there are changes to commit
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update daily exchange rates and money supply [skip ci]"
          git push
        else
          echo "No changes to commit."
        fi
